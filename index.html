header{background:linear-gradient(135deg,#ec4899,#3b82f6);color:#fff;padding:1.2rem;text-align:center}
header h1{font-size:1.5rem}
header p{font-size:.85rem;opacity:.9}
nav{display:flex;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:0;z-index:9}
nav button{flex:1;padding:.9rem;border:none;background:#fff;font-size:1rem;cursor:pointer;color:#666;border-bottom:3px solid transparent}
nav button.active{color:#ec4899;border-bottom-color:#ec4899;font-weight:700}
main{padding:1rem;max-width:900px;margin:0 auto}
.seccion{display:none}
.seccion.active{display:block}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1.2rem}
.tarjeta{background:#fff;border-radius:12px;padding:1rem;box-shadow:0 2px 8px rgba(0,0,0,.08);text-align:center}
.tarjeta .valor{font-size:1.4rem;font-weight:800;color:#ec4899}
.tarjeta .etiqueta{font-size:.75rem;color:#888;margin-top:.3rem}
.tarjeta.azul .valor{color:#3b82f6}
h2{margin:1.2rem 0 .6rem;font-size:1.1rem;color:#555}
.buscador{width:100%;padding:.8rem;border:2px solid #fbcfe8;border-radius:10px;font-size:1rem;margin-bottom:.8rem;outline:none}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:.8rem}
.chip{white-space:nowrap;padding:.5rem 1rem;border-radius:20px;border:2px solid #fbcfe8;background:#fff;cursor:pointer;font-size:.85rem}
.chip.active{background:#ec4899;color:#fff;border-color:#ec4899}
.productos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.8rem}
.prod{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.prod .foto{height:110px;background:linear-gradient(135deg,#fce7f3,#dbeafe);display:flex;align-items:center;justify-content:center;font-size:2.5rem}
.prod .info{padding:.7rem}
.prod .nombre{font-weight:700;font-size:.9rem}
.prod .cat{font-size:.7rem;color:#fff;background:#a78bfa;border-radius:8px;padding:.1rem .5rem;display:inline-block;margin:.3rem 0}
.prod .desc{font-size:.75rem;color:#888;margin-bottom:.4rem}
.prod .precio{font-weight:800;color:#ec4899;font-size:1rem}
.prod .precio-t{font-size:.75rem;color:#3b82f6}
.prod .stock{font-size:.7rem;color:#16a34a;margin-top:.2rem}
footer{text-align:center;padding:1.5rem;color:#aaa;font-size:.75rem}
.barra{height:8px;background:#f3f4f6;border-radius:4px;overflow:hidden;margin-top:.3rem}
.barra div{height:100%;background:linear-gradient(90deg,#ec4899,#3b82f6);border-radius:4px}
.top-item{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid #f3f4f6;font-size:.85rem}
</style>
